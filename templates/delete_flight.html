<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Aircraft</th>
            <th>Pilot</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for flight in flights %}
        <tr>
            <td>{{ flight.id }}</td>
            <td>{{ flight.aircraft }}</td>
            <td>{{ flight.pilot }}</td>
            <td>
                <a href="{{ url_for('edit_flight', flight_id=flight.id) }}">Edit</a>
                <form method="post" action="{{ url_for('delete_flight', flight_id=flight.id) }}" style="display:inline;">
                    <button type="submit" onclick="return confirm('Are you sure you want to delete this flight?');">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
