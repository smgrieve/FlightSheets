<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        form {
            max-width: 400px;
            margin: auto;
        }
        input, button {
            width: 100%;
            margin: 8px 0;
            padding: 10px;
        }
        .message {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2 style="text-align:center;">Reset Password</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="message">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post">
        <!-- Email field -->
        <label for="email">Email</label>
        <input type="email" name="email" id="email" required value="{{ email or '' }}">

        <!-- Send Code button -->
        <button type="submit" name="action" value="send_code">Send Code</button>

        <!-- Code entry -->
        <label for="reset_code">Reset Code</label>
        <input type="text" name="reset_code" id="reset_code" placeholder="Enter code">

        <!-- New password -->
        <label for="new_password">New Password</label>
        <input type="password" name="new_password" id="new_password" placeholder="New password">

        <label for="confirm_password">Confirm Password</label>
        <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirm new password">

        <!-- Submit button -->
        <button type="submit" name="action" value="reset_password">Reset Password</button>
    </form>
</body>
</html>
