<form method="post">
    <label for="base_fee">Base Fee:</label>
    <input type="number" step="0.01" name="base_fee" value="{{ tow_rate[0] }}" required>
    
    <label for="rate_per_100ft">Rate per 100ft:</label>
    <input type="number" step="0.01" name="rate_per_100ft" value="{{ tow_rate[1] }}" required>
    
    <button type="submit">Update Rates</button>
</form>
