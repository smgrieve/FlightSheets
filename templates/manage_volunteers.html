<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Volunteers</title>
</head>
<body>
    <h1>Manage Volunteers</h1>
    <form method="POST" action="{{ url_for('manage_volunteers') }}">
        <input type="hidden" name="action" value="add">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>       
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
	<br><br>  
        <button type="submit">Add Volunteer</button>
    </form>
    <br><br>  
    <form method="POST" action="{{ url_for('manage_volunteers') }}">
        <input type="hidden" name="action" value="remove">
        <label for="volunteer_id">Volunteer ID to Remove:</label>
        <input type="text" id="volunteer_id" name="volunteer_id" required>
        
        <button type="submit">Remove Volunteer</button>
    </form>
</body>
</html>
